apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: tenant-${{ values.name }}
  title: ${{ values.name }}
  description: Tenant namespace provisioned by Crossplane from tenants/${{ values.name }}.yaml
  annotations:
    # Every object Crossplane composes for this Tenant, and the Tenant
    # itself, carries this label.
    backstage.io/kubernetes-label-selector: crossplane.io/composite=${{ values.name }}
  links:
    - url: https://github.com/idPlatformKit/instances/blob/main/tenants/${{ values.name }}.yaml
      title: Tenant claim
spec:
  type: tenant
  owner: group:default/${{ values.ownerGroup }}
