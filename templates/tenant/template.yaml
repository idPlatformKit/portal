apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-tenant
  title: New Tenant
  description: >-
    Request a tenant for your team: one isolated namespace per environment
    (staging and prod, with quota, limits, RBAC and a network policy),
    optionally with its own OpenBao secrets namespace. Opens a pull request
    adding a Tenant claim to the instances repository.
  tags:
    - crossplane
    - gitops
    - tenant
spec:
  owner: user:default/antoyavin
  type: platform

  parameters:
    - title: Tenant
      required:
        - name
        - ownerGroup
      properties:
        name:
          title: Name
          type: string
          description: >-
            The namespaces are <name>-staging and <name>-prod: lowercase
            letters, digits and dashes, starting and ending with a letter
            or digit.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 55
          ui:autofocus: true
        ownerGroup:
          title: Owner group
          type: string
          description: >-
            GitHub team that owns the tenant: `edit` in staging, read-only in
            prod (deployments there go through pull requests).
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              - kind: Group
                metadata.annotations.github.com/team-slug:
                  exists: true
        environments:
          title: Environments
          type: array
          description: >-
            Each one is a namespace with its own rules: staging is where the
            team works, prod is stricter (images by digest, at least 2
            replicas, Pod Security restricted).
          items:
            type: string
            enum: [staging, prod]
          uniqueItems: true
          minItems: 1
          default: [staging, prod]
          ui:widget: checkboxes
        vaultEnabled:
          title: OpenBao secrets namespace
          type: boolean
          description: >-
            Give the tenant its own isolated OpenBao namespace, with one KV
            mount per environment.
          default: false
      dependencies:
        vaultEnabled:
          oneOf:
            - properties:
                vaultEnabled:
                  const: false
            - required:
                - serviceAccountName
              properties:
                vaultEnabled:
                  const: true
                serviceAccountName:
                  title: ServiceAccount
                  type: string
                  description: >-
                    Created in each environment's namespace, and the only
                    ServiceAccount allowed to read that environment's
                    secrets. Run the workloads that need them as it. Each
                    environment's "openbao" SecretStore uses it to deliver
                    them as Kubernetes Secrets.
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

    - title: Pull request
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Instances repository
          type: string
          description: >-
            The pull request is opened with your own GitHub identity, so you
            will be asked to grant the portal access to public repositories.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            # The installation's org and instances repository, from the
            # portal's config (idpk.github), see
            # packages/backend/src/modules/idpkConfigPlaceholder.ts.
            allowedOwners:
              - $idpkConfig: github.org
            allowedRepos:
              - $idpkConfig: github.instancesRepo
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
              additionalScopes:
                github:
                  - public_repo

  steps:
    - id: claim
      name: Generate the Tenant claim
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          ownerGroup: ${{ parameters.ownerGroup | parseEntityRef | pick('name') }}
          environments: ${{ parameters.environments }}
          vaultEnabled: ${{ parameters.vaultEnabled }}
          serviceAccountName: ${{ parameters.serviceAccountName }}
          instancesUrl: https://${{ parameters.repoUrl | parseRepoUrl | pick('host') }}/${{ parameters.repoUrl | parseRepoUrl | pick('owner') }}/${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}

    - id: pr
      name: Open the pull request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: tenant/${{ parameters.name }}
        title: 'feat: add tenant ${{ parameters.name }}'
        description: |
          Adds the `${{ parameters.name }}` Tenant, owned by `${{ parameters.ownerGroup | parseEntityRef | pick('name') }}`.

          Opened from the IdPlatformKit portal ("New Tenant" template). CI validates the claim against the Orchestrator XRDs; once merged, Argo CD syncs it and Crossplane provisions its namespaces: ${{ parameters.name }}-${{ parameters.environments | join(', ' + parameters.name + '-') }}.
        token: ${{ secrets.USER_OAUTH_TOKEN }}

  output:
    links:
      - title: Pull request
        url: ${{ steps['pr'].output.remoteUrl }}
