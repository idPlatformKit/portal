# Configuration of the portal image, as deployed in the cluster by the
# Orchestrator (platform/portal/). Loaded on top of app-config.yaml.
# Everything installation-specific comes from environment variables, set by
# the Orchestrator from the installer's configuration:
#   PORTAL_BASE_URL            https://portal.127.0.0.1.nip.io on kind
#   IDPK_GITHUB_ORG            the GitHub org whose users and teams sign in
#   IDPK_INSTANCES_REPO        the name of that org's instances repository
#   GITHUB_TOKEN               reads the org and opens nothing on its own
#   AUTH_GITHUB_CLIENT_ID/_SECRET  the org's OAuth App, for sign-in
# Not for production use as is: in-memory database, allow-all permissions.

app:
  title: IdPlatformKit portal
  baseUrl: ${PORTAL_BASE_URL}

organization:
  name: ${IDPK_GITHUB_ORG}

backend:
  baseUrl: ${PORTAL_BASE_URL}
  listen: ':7007'
  cors:
    origin: ${PORTAL_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # In-memory, like the dev setup: the catalog is rebuilt from GitHub on every
  # start (the org import runs 5 seconds after startup).
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

catalog:
  # Replaces the example data of app-config.yaml: only the IdPlatformKit
  # templates, plus what the providers import from GitHub.
  locations:
    - type: file
      target: ./templates/tenant/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/postgres-database/template.yaml
      rules:
        - allow: [Template]

kubernetes:
  # The cluster the portal runs in, read with the pod's own ServiceAccount
  # (the read-only backstage-reader, see Orchestrator platform/portal/).
  # There's no in-cluster locator type in this plugin version: a `config`
  # cluster with the serviceAccount auth provider and no token falls back to
  # the pod's mounted token.
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: idplatformkit-local
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          skipMetricsLookup: true
